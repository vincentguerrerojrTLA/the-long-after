name: Apply TLA favicon

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-favicon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact TLA EXE logo favicon
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<meta name="theme-color" content="#070a08" />'
          link = '<link rel="icon" type="image/png" href="./favicon.png" sizes="32x32" />'
          if link not in s:
              if marker not in s:
                  raise SystemExit('theme-color marker not found in index.html')
              s = s.replace(marker, marker + '\n' + link, 1)
              p.write_text(s, encoding='utf-8')
          PY

          printf '%s' '' | base64 -d > favicon.png

          rm -f favicon.ico favicon.svg assets/favicon-note.txt THIS_SHOULD_NOT_EXIST.txt DO_NOT_USE.txt
          rm -f .github/workflows/apply-tla-favicon.yml

      - name: Commit website favicon update
        shell: bash
        run: |
          git config user.name 'TLA Website Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Use TLA EXE logo as website favicon'
          git push origin main

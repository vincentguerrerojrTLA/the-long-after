name: Install TLA brand and progress gauge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-tla-brand-progress.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install distinct TLA favicon files and percentage gauge
        shell: bash
        run: |
          cat > /tmp/favicon32.b64 <<'EOF'
          
          EOF
          cat > /tmp/favicon64.b64 <<'EOF'
          
          EOF
          tr -d '[:space:]' < /tmp/favicon32.b64 | base64 -d > tla-favicon-32.png
          tr -d '[:space:]' < /tmp/favicon64.b64 | base64 -d > tla-favicon-64.png
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          # Replace any existing favicon declarations with uniquely named TLA-only files.
          s = re.sub(r'<link rel="icon"[^>]*>\s*', '', s, count=1)
          s = re.sub(r'<link rel="shortcut icon"[^>]*>\s*', '', s, count=1)
          marker = '<meta name="theme-color" content="#070a08" />'
          favicon = '''<meta name="theme-color" content="#070a08" />\n<link rel="icon" type="image/png" sizes="32x32" href="./tla-favicon-32.png?v=3" />\n<link rel="icon" type="image/png" sizes="64x64" href="./tla-favicon-64.png?v=3" />\n<link rel="shortcut icon" href="./tla-favicon-32.png?v=3" />'''
          if marker not in s:
              raise SystemExit('theme-color marker not found')
          s = s.replace(marker, favicon, 1)

          css_old = '.bar i{display:block;height:100%;width:75%;background:var(--acid)}'
          css_new = css_old + '.percent-gauge{display:flex;align-items:center;justify-content:space-between;margin-top:9px;padding:8px 10px;border:1px solid rgba(183,255,60,.2);background:rgba(183,255,60,.045)}.percent-gauge span{color:var(--muted);font:700 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.09em;text-transform:uppercase}.percent-gauge strong{color:var(--acid);font:900 18px/1 ui-monospace,SFMono-Regular,Menlo,monospace}'
          if css_old not in s:
              raise SystemExit('progress bar CSS marker not found')
          s = s.replace(css_old, css_new, 1)

          html_old = '<div class="phase-box"><div class="phase-row"><span>01 — Foundation</span><span>3 / 4</span></div><div class="bar"><i></i></div><div class="release-note">'
          html_new = '<div class="phase-box"><div class="phase-row"><span>01 — Foundation</span><span>3 / 4</span></div><div class="bar" role="progressbar" aria-label="Foundation completion" aria-valuemin="0" aria-valuemax="100" aria-valuenow="75"><i></i></div><div class="percent-gauge"><span>Foundation completion</span><strong>75%</strong></div><div class="release-note">'
          if html_old not in s:
              raise SystemExit('phase progress HTML marker not found')
          s = s.replace(html_old, html_new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          rm .github/workflows/install-tla-brand-progress.yml
      - name: Commit website branding and progress gauge
        run: |
          git config user.name "TLA Website Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Use distinct TLA favicon and add percent gauge"
          git push origin main
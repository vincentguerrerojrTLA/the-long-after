name: Refresh TLA favicon cache key
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump favicon cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('tla-favicon-32.png?v=3', 'tla-favicon-32.png?v=4')
          s = s.replace('tla-favicon-64.png?v=3', 'tla-favicon-64.png?v=4')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove one-time cache refresher
        run: rm -f .github/workflows/bump-favicon-cache.yml
      - name: Commit favicon cache refresh
        run: |
          git config user.name "TLA Website Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/bump-favicon-cache.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh optimized TLA favicon cache"
          git push

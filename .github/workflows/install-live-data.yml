name: Install live website data loader
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject live sync loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./assets/live-sync.js?v=2"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('index.html has no </body> tag')
              s = s.replace('</body>', f'{tag}\n</body>')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Remove one-time installer
        run: rm -f .github/workflows/install-live-data.yml
      - name: Commit installation
        run: |
          git config user.name "TLA Website Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/install-live-data.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Enable live project and lore data on website"
          git push

name: Force-refresh TLA favicon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-favicon-path.yml'

permissions:
  contents: write

jobs:
  fix-favicon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Force explicit GitHub Pages favicon path
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<link rel="icon" type="image/png" href="./favicon.png" sizes="32x32" />'
          new = ('<link rel="icon" type="image/png" sizes="32x32" href="/the-long-after/favicon.png?v=20260921-2" />\n'
                 '<link rel="shortcut icon" type="image/png" href="/the-long-after/favicon.png?v=20260921-2" />')
          if old not in s:
              raise SystemExit('Expected favicon tag not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/fix-favicon-path.yml
      - name: Commit favicon path fix
        run: |
          git config user.name "TLA Website Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/fix-favicon-path.yml
          git commit -m "Force-refresh TLA website favicon"
          git push origin main

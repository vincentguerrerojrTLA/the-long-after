name: Install branded website assets

on:
  push:
    paths:
      - '.asset-upload/READY'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify staged asset bundle
        shell: bash
        run: |
          set -euo pipefail
          for n in 00 01 02 03; do
            test -s ".asset-upload/branded_assets_part_${n}" || { echo "Missing bundle part ${n}"; exit 1; }
          done

      - name: Decode branded high-quality website assets
        shell: bash
        run: |
          set -euo pipefail
          cat .asset-upload/branded_assets_part_00 .asset-upload/branded_assets_part_01 .asset-upload/branded_assets_part_02 .asset-upload/branded_assets_part_03 > /tmp/branded-assets.b64
          base64 --decode /tmp/branded-assets.b64 > /tmp/branded-assets.zip
          unzip -o /tmp/branded-assets.zip -d assets
          files=(
            ammunition backhoe-loader bulldozer dump-truck excavator launcher
            motor-grader pump-shotgun sidearm skid-steer survivor-rifle telehandler
            utility-vehicle wheel-loader
          )
          for f in "${files[@]}"; do
            test -s "assets/${f}.jpg" || { echo "Decoded asset missing: ${f}.jpg"; exit 1; }
            rm -f "assets/${f}.png"
          done

      - name: Point website to branded replacements
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          names = [
              'ammunition','backhoe-loader','bulldozer','dump-truck','excavator','launcher',
              'motor-grader','pump-shotgun','sidearm','skid-steer','survivor-rifle','telehandler',
              'utility-vehicle','wheel-loader'
          ]
          for name in names:
              text = text.replace(f"assets/{name}.png", f"assets/{name}.jpg?v=tla-branded-20260921")
          p.write_text(text, encoding='utf-8')

      - name: Clean staging files and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .asset-upload
          rm -f .github/workflows/install-branded-assets.yml
          git config user.name "TLA Website Bot"
          git config user.email "331753744+vincentguerrerojrTLA@users.noreply.github.com"
          git add -A
          git commit -m "Replace pixelated item art with branded TLA assets"
          git push origin HEAD:main
